[pytest]
testpaths = tests
pythonpath = .
addopts = --basetemp=./.pytest_tmp -p no:cacheprovider --durations=25 --timeout=10 --timeout-method=thread
markers =
    slow: intentionally slow; optional quality_gate --skip-slow-tests or -m "not slow"
    network: typically needs outbound network/long external IO; --skip-network-tests or -m "not network"
