[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".venv",
  ".pytest_tmp",
  "data",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "E402", "UP017", "UP035"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "(^tests/|^data/|^dist/)"

